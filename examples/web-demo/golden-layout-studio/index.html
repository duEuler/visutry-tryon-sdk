<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisuTry / Golden Layout Studio</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">V</span><strong>VISUTRY</strong><span>/ GOLDEN LAYOUT STUDIO</span>
      </div>
      <div class="session">
        <span class="dot"></span> <span id="studio-mode">static</span>
        <span id="studio-status" class="muted" role="status" aria-live="polite">Pronto</span>
        <span class="muted">React-ready</span>
      </div>
      <div class="toolbar-shell">
        <div class="toolbar toolbar-layout" aria-label="Controles de layout">
          <button id="expand-accordions" data-icon="＋" data-studio-action="expand" aria-label="Expandir painéis" title="Expandir painéis">Expandir painéis</button>
          ><button id="collapse-accordions" data-icon="−" data-studio-action="collapse" aria-label="Recolher painéis" title="Recolher painéis">Recolher painéis</button>
          ><button id="show-side-panels" data-icon="◧" data-studio-action="show-side-panels" aria-label="Mostrar laterais" title="Mostrar laterais">Mostrar laterais</button>
          ><button id="hide-side-panels" data-icon="◨" data-studio-action="hide-side-panels" aria-label="Ocultar laterais" title="Ocultar laterais">Ocultar laterais</button>
          ><button id="toggle-layout-lock" data-icon="🔒" data-studio-action="lock" aria-label="Bloquear layout" title="Bloquear layout" aria-pressed="false">
            Bloquear layout</button>
          ><button id="save-layout" data-icon="💾" data-studio-action="save" aria-label="Salvar layout" title="Salvar layout">Salvar layout</button>
          ><button id="reset-layout" data-icon="↺" data-studio-action="restore" aria-label="Restaurar padrão" title="Restaurar padrão">Restaurar padrão</button>
        </div>
        <div class="toolbar toolbar-runtime" aria-label="Controles de runtime">
          <button id="connect-runtime" data-icon="▶" data-runtime-control="connect" aria-label="Conectar runtime" title="Conectar runtime">Conectar runtime</button>
          ><button id="start-camera" data-icon="◉" data-runtime-control="camera" aria-label="Iniciar câmera" title="Iniciar câmera" disabled>Iniciar câmera</button>
          ><button id="start-tryon" data-icon="△" data-runtime-control="tryon" aria-label="Iniciar try-on" title="Iniciar try-on" disabled>Iniciar try-on</button>
          ><button id="load-glb" data-icon="◫" data-runtime-control="glb" aria-label="Carregar GLB" title="Carregar GLB" disabled>Carregar GLB</button>
          ><button id="capture-evidence" data-icon="▣" data-runtime-control="evidence" aria-label="Capturar evidência" title="Capturar evidência" disabled>Capturar evidência</button>
          ><button id="stop-runtime" data-icon="■" data-runtime-control="stop" aria-label="Parar runtime" title="Parar runtime" disabled>Parar runtime</button>
        </div>
      </div>
    </header>
    <main id="layout-host" aria-label="Bancada de auditoria Golden Layout"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
